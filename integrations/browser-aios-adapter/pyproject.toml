[project]
name = "octopus-browser-aios-adapter"
version = "0.1.0"
description = "Безопасный CDP-адаптер браузерных профилей для Octopus/AIOS с vision routing"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "playwright>=1.45,<2",
    "pydantic>=2.7,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
octopus-browser-aios-adapter = "octopus_browser_adapter.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
