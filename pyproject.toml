[project]
name = "octopus-browser"
version = "0.3.2"
description = "Octopus Browser — secure AI-controlled browser runtime"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [{ name = "JoTalbot" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "playwright>=1.45,<2",
    "httpx>=0.27,<1",
    "cryptography>=42,<47",
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.4,<1", "build>=1,<2"]
[project.scripts]
octopus-browser = "octopus_browser.main:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
