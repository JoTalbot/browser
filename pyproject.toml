[project]
name = "octopus-browser"
version = "0.2.0"
description = "Octopus Browser — secure AI-controlled browser runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JoTalbot" }]
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
    "playwright>=1.43,<2",
    "httpx>=0.27,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.4,<1", "httpx>=0.27,<1"]
[project.scripts]
octopus-browser = "octopus_browser.main:main"
[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["I001"]
[tool.pytest.ini_options]
testpaths = ["tests"]
