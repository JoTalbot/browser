# 🐙 Octopus Browser — GitHub → server deployment
name: Deploy Octopus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

  deploy:
    name: Deploy to server
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup SSH deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Sync and update on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          host="${DEPLOY_HOST:?secrets.DEPLOY_HOST not set}"
          user="${DEPLOY_USER:-ubuntu}"
          path="${DEPLOY_PATH:-/opt/octopus-browser}"
          echo "Updating ${user}@${host}:${path}"
          ssh -o StrictHostKeyChecking=accept-new "${user}@${host}" \
            "mkdir -p '${path}' && cd '${path}' && [ -d .git ] || git clone https://github.com/${GITHUB_REPOSITORY}.git '${path}'" \
            && ssh -o StrictHostKeyChecking=accept-new "${user}@${host}" \
                 "DEPLOY_PATH='${path}' bash '${path}/deploy/server-update.sh'" \
            || { echo "fallback: copying and running server-update.sh directly"; \
                 scp -o StrictHostKeyChecking=accept-new deploy/server-update.sh "${user}@${host}:/tmp/octopus-update.sh"; \
                 ssh -o StrictHostKeyChecking=accept-new "${user}@${host}" "DEPLOY_PATH='${path}' bash /tmp/octopus-update.sh"; }
          echo "Deploy finished"
