name: Security & SBOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Release audit
        run: python scripts/release_audit.py

      - name: Dependency audit
        run: python -m pip install 'pip-audit==2.10.1' && pip-audit --strict

      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install 'cyclonedx-bom==7.3.1'
          cyclonedx-py environment --output-format json --output-file sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: octopus-browser-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
